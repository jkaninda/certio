# Certio — a complete single-node deployment.
#
# Before the first run, generate the two secrets:
#
#   docker run --rm jkaninda/certio:latest keygen
#
# Write them into ./secrets/master_key and ./secrets/jwt_secret (the value
# only, no CERTIO_… prefix). Back the master key up somewhere other than the
# volume it protects: without it, every stored private key is unreadable.

services:
  certio:
    image: jkaninda/certio:latest
    container_name: certio
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Refuses to boot without a real master key and JWT secret.
      CERTIO_PRODUCTION: "true"

      CERTIO_MASTER_KEY_FILE: /run/secrets/master_key
      CERTIO_JWT_SECRET_FILE: /run/secrets/jwt_secret

      CERTIO_DB_URL: sqlite:///data/certio.db

      # Baked into the CRL distribution point of every certificate issued from
      # here on, so it has to be the URL clients can actually reach.
      CERTIO_BASE_URL: https://certio.example.com

      # Creates the first administrator on an empty database, then never again.
      CERTIO_ADMIN_EMAIL: admin@example.com
      CERTIO_ADMIN_PASSWORD: change-this-immediately

      CERTIO_DEFAULT_ORGANIZATION: Example Ltd
      CERTIO_DEFAULT_COUNTRY: CD

      # once | always | never — how often a private key may be downloaded.
      CERTIO_KEY_DOWNLOAD_POLICY: always

      CERTIO_SCHEDULER_ENABLED: "true"
      CERTIO_SCHEDULER_INTERVAL: 1h
      CERTIO_EXPIRY_WARN_DAYS: "30"

      CERTIO_LOG_LEVEL: info
      CERTIO_LOG_FORMAT: json

    volumes:
      - certio_data:/data

    secrets:
      - master_key
      - jwt_secret

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

secrets:
  master_key:
    file: ./secrets/master_key
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  certio_data:

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # openssl is present on the runner, so the cross-check tests in
      # internal/pki run for real rather than skipping.
      - name: openssl version
        run: openssl version

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './web/*'))
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # v9 runs golangci-lint v2, which .golangci.yml is already written for.
      # The timeout lives in that file, so it is not repeated here.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  ui:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: web/.output/public
          retention-days: 1

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: [test, ui]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: dashboard
          path: cmd/certio/dist

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
            -o bin/certio ./cmd/certio

      # A binary that cannot complete the core flow is not a passing build.
      - name: Smoke test
        run: |
          set -euo pipefail
          eval "$(./bin/certio keygen | grep -v '^#' | sed 's/^/export /')"
          export CERTIO_DB_URL=sqlite:///tmp/smoke.db
          ./bin/certio migrate
          ./bin/certio ca create --cn "CI Root CA" --org CI --country CD
          ./bin/certio cert issue --ca ci-root-ca --cn ci.example.com \
            --san dns:ci.example.com --san ip:127.0.0.1 -o /tmp/out
          # `cert issue -o` slugifies the common name, so ci.example.com is
          # written as ci-example-com.crt. Named explicitly rather than globbed:
          # a change to that rule should fail here, not pass quietly.
          ls -1 /tmp/out
          openssl verify -CAfile /tmp/out/root.crt /tmp/out/ci-example-com.crt
          ./bin/certio cert list

      - uses: actions/upload-artifact@v7
        with:
          name: certio-linux-amd64
          path: bin/certio